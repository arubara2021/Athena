app:
  name: "research_agent"
  version: "0.2.0"
  environment: "development"
  debug: false

logging:
  level: "INFO"
  directory: "logs"
  max_bytes: 5242880
  backup_count: 5
  json_output: true

storage:
  output_directory: "output"
  cache_directory: "cache"
  data_directory: "data"
  database_filename: "research_agent.db"
  json_subdirectory: "json"
  markdown_subdirectory: "markdown"
  reports_subdirectory: "reports"

http:
  timeout_seconds: 30
  connect_timeout_seconds: 10
  max_retries: 2
  retry_backoff_seconds: 1
  follow_redirects: true

cache:
  enabled: true
  default_ttl_seconds: 86400
  max_entries: 10000

modes:
  default_mode: "balanced"
  fast:
    iterations: 1
    model_tier: "fast"
    top_n: 10
    enhance: "none"
    budget: 8000
    min_sources: 5
    parallel_stages: true
    skip_ranking_llm: true
    skip_path_llm: true
    search_timeout_seconds: 10
    summarize_max: 5
    summarize_concurrency: 3
    summarize_batch_pause: 0.0
    max_query_variants: 2
    enable_rag: false
    use_llm_expansion: false
  balanced:
    iterations: 2
    model_tier: "strong"
    top_n: 15
    enhance: "light"
    budget: 15000
    min_sources: 8
    parallel_stages: true
    skip_ranking_llm: false
    skip_path_llm: false
    search_timeout_seconds: 12
    summarize_max: 10
    summarize_concurrency: 3
    summarize_batch_pause: 0.4
    max_query_variants: 3
    enable_rag: false
    use_llm_expansion: true
  deep:
    iterations: 15
    model_tier: "strong"
    top_n: 20
    enhance: "full"
    budget: 40000
    min_sources: 10
    parallel_stages: true
    skip_ranking_llm: false
    skip_path_llm: false
    search_timeout_seconds: 20
    summarize_max: 20
    summarize_concurrency: 4
    summarize_batch_pause: 0.2
    max_query_variants: 5
    enable_rag: true
    use_llm_expansion: true

domain_routing:
  enabled: true
  min_sources_before_domain_expansion: 12
  max_domains_per_query: 3
  min_confidence: 0.35
  use_universal_when_low_confidence: true
  use_universal_when_low_sources: true
  respect_explicit_platforms: true
  allow_domain_fallback: true
  max_domain_platforms: 20

search:
  default_max_results: 20
  min_max_results: 1
  max_max_results: 100
  max_query_variants: 5
  concurrency: 6
  request_timeout_seconds: 12
  max_platform_timeout_seconds: 12
  use_llm_expansion: true
  universal_query_correction: true
  correct_spelling: true
  extract_primary_concept: true
  extract_keywords: true
  generate_short_search_queries: true
  detect_intent: true
  detect_level: true
  fallback_to_local: true
  keyless_fallback_enabled: true
  min_sources_before_fallback: 10
  relevance_gate_enabled: true
  relevance_gate_min_title_overlap_mode: dynamic
  llm_relevance_enabled: true
  llm_relevance_batch_size: 10
  llm_relevance_max_sources: 40
  llm_relevance_min_sources: 3
  llm_relevance_model_limit: 3
  rag_min_score_default: 0.25
  rag_min_score_small_corpus: 0.35
  rag_min_score_minimum: 0.05
  rag_small_corpus_cutoff: 100
  rag_medium_corpus_cutoff: 1000
  rag_rerank_min_candidates: 2
  rag_chunk_query_token_threshold: 3
  rag_chunk_gate_min_tokens: 2
  rag_chunk_gate_max_tokens: 20
  rag_chunk_gate_adaptive: true
  fallback_platforms:
    - arxiv
    - openalex
    - wikipedia
    - crossref
    - europe_pmc
    - pubmed
    - doaj
    - zenodo
    - open_library
    - internet_archive
    - wikibooks
    - wikiversity
    - github
    - huggingface

rag:
  answer_style_max_tokens:
    short: 500
    standard: 1600
    detailed: 2800
    exhaustive: 3200
  answer_style_temperature:
    short: 0.05
    standard: 0.10
    detailed: 0.10
    exhaustive: 0.08
  chunked_indexing_enabled: true
  chunk_index_tokens: 220
  chunk_index_max_chunks_per_source: 30
  chunk_index_fallback_to_parent: true
  chunk_index_fail_open: true

rag_intent_router:
  model_tier: fast
  model_limit: 3
  timeout_seconds: 10.0
  max_tokens: 16
  temperature: 0.0
  retry_count: 1
  cache_size: 512
  fallback_route: other
  fallback_reason: llm_unavailable

rag_catalog:
  snapshot:
    max_documents: 2000
    max_titles: 20
    max_platform_slices: 12
    max_source_type_slices: 12
    max_domain_slices: 12
    max_topic_slices: 15
    max_year_slices: 10
    max_run_slices: 10
  confidence:
    weights:
      llm_used: 0.30
      classifier_confidence: 0.25
      snapshot_richness: 0.15
      answer_substance: 0.20
      dimension_coverage: 0.10
    refusal_cap: 0.20
  escalation:
    min_documents_for_topics: 5
    min_documents_for_domains: 3
    min_documents_for_platforms: 2
  model:
    tier: fast
    limit: 2
    max_output_tokens: 1200
    temperature: 0.10

ranking:
  use_llm: true
  max_llm_sources: 10
  max_models: 1
  heuristic_fallback_enabled: true

learning_path:
  use_llm: true
  max_resources_per_step: 4
  max_output_tokens: 4000
  prompt_tier_escalation: false

cli:
  default_mode: "balanced"
  goal: "Learn from basics to advanced"
  level: "beginner to advanced"
  max_results: 20
  display_limit: 10
  use_llm_expansion: true
  use_llm_ranking: true
  use_llm_learning_path: true
  enable_rag: true
  show_ai_query_understanding: true
  show_failed_platforms: true
  show_no_source_diagnosis: true

query_intelligence:
  enabled: true
  auto_correct: true
  use_llm_when_provider_available: true
  fallback_to_local: true
  require_llm_keys: true
  max_corrected_topic_words: 10
  max_primary_concept_words: 8
  max_keywords: 12
  max_short_queries: 8
  max_query_words: 10
  temperature: 0.0
  max_tokens: 1024
  model_limit: 3
  timeout_seconds: 30

llm_relevance:
  enabled: true
  batch_size: 10
  max_sources_to_judge: 40
  min_sources_required: 3
  provider_tier: fast
  temperature: 0.0
  max_tokens: 2048
  model_limit: 3

llm:
  primary_fast_model: "ministral-3b-2512"
  primary_strong_model: "gemma-4-31B-it"
  ensemble_judge_model: "ministral-14b-2512"
  code_model: "codestral-latest"
  embedding_model: "mistral-embed"
  fast_model_chain:
    - "ministral-3b-2512"
    - "qwen/qwen3.8-27b"
    - "gemini-3.5-flash"
  strong_model_chain:
    - "gemma-4-31B-it"
    - "ministral-14b-2512"
    - "MiniMax-M2.7"
  voting_mode: "majority"
  consensus_threshold: 0.7
  rate_limit_per_minute: 15
  timeout_seconds: 20
  connect_timeout_seconds: 8
  max_retries: 2
  retry_backoff_seconds: 1.5