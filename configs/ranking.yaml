scorer:
  weights:
    relevance: 0.42
    authority: 0.12
    type_quality: 0.10
    impact: 0.10
    recency: 0.08
    content: 0.08
    support: 0.05
    authors: 0.05

classifier:
  keyword_weights:
    beginner: 0.9
    intermediate: 0.6
    advanced: 0.7
  content:
    weight_paper: 2.6
    weight_other: 1.1
    beginner_max_complexity: 0.35
    intermediate_max_complexity: 0.62
    fog_min: 6.0
    fog_max: 18.0
    fog_weight: 0.6
    jargon_weight: 0.4
    jargon_density_cap: 0.05
    complex_word_syllables: 3
  intro_phrasing:
    beginner_weight: 1.1
    intermediate_weight: 0.3
    max_points: 3

confidence:
  base: 0.40
  margin_factor: 0.40
  max: 0.95
  source_type_bonus:
    documentation:  { beginner: 1.2, intermediate: 0.4 }
    course:         { beginner: 1.6, intermediate: 0.3 }
    video:          { beginner: 1.0, intermediate: 0.4 }
    blog:           { beginner: 0.8, intermediate: 0.4 }
    repository:     { beginner: 0.0, intermediate: 1.4 }
    model:          { beginner: 0.0, intermediate: 1.0 }
    dataset:        { beginner: 0.0, intermediate: 0.8 }
    research_paper: { beginner: 0.0, intermediate: 0.2 }
  platform_bonus:
    wikipedia:    { beginner: 0.5, intermediate: 0.4 }
    github:       { beginner: 0.0, intermediate: 0.8 }
    huggingface:  { beginner: 0.0, intermediate: 0.5 }

alignment:
  cap: 0.50
  beginner_request:
    difficulty:
      beginner: 0.30
      intermediate: 0.05
      advanced: -0.40
    source_type:
      documentation: 0.25
      course: 0.25
      video: 0.20
      blog: 0.10
      repository: 0.10
      research_paper: -0.15
  advanced_request:
    difficulty:
      advanced: 0.12
      intermediate: 0.03
      beginner: -0.10
    source_type:
      research_paper: 0.05

consensus:
  max_models: 3
  max_llm_sources: 20
  judge_max_attempts: 2
  min_votes_for_judge: 2
  min_relevance_score: 0.20
  min_llm_score: 0.05

learning_path:
  floor_min: 0.30
  floor_scale: 0.45
  fallback_min: 0.20
  fallback_scale: 0.60
  core_min: 0.25
  core_scale: 0.75
  advanced_min: 0.20
  deepen_min: 0.15
  deepen_scale: 0.40

